};
const allLessons=()=>UNITS.flatMap(u=>u.lessons.map(l=>({u,l})));

/* ---------- Écran d'accueil ---------- */
function home(){
  const total=allLessons().length;const done=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).length;
  const next=allLessons().find(x=>!(S.lessons[x.l.id]&&S.lessons[x.l.id].done));
  let h=`<div class="screen"><header class="hdr"><div class="logo">${ICON.cup.replace('viewBox','style="color:var(--brand)" viewBox')}Hygée</div><div class="stats"><div class="stat fire" title="Jours d'affilée">${ICON.fire}${streakAlive()?S.streak:0}</div><div class="stat xp" title="Points d'expérience">${ICON.bolt}${S.xp}</div></div></header>
  <div class="home">
  <section class="hero"><h1>UE2 · Prévention et promotion de la santé</h1><p>Sept unités tirées des cours de l'EHESP (Raude, Breton, Geindreau, Fèvre, CCNDS). Chaque leçon dure trois à cinq minutes et te fait gagner des points.</p>
  <div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="prog-l">${done} leçon${done>1?'s':''} sur ${total} terminée${done>1?'s':''}</div>
  <div class="row" style="margin-top:12px">${next?`<button class="btn" data-start="${next.l.id}">${done?'Continuer':'Commencer'}</button>`:''}<button class="btn ghost" data-review="1">Révision mixte</button><a class="btn ghost" href="${FICHES_URL}">Fiches détaillées</a></div></section>`;
  UNITS.forEach(u=>{
    const ld=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length;
    const gold=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].best===100).length;
    h+=`<section class="unit" style="--c:var(${u.c});--cd:var(${u.c}d)"><div class="unit-h"><div><div class="n">Unité ${u.n}</div><h2>${esc(u.title)}</h2><div class="who">${esc(u.who)}</div></div><div class="crown">${ICON.star}${gold}/${u.lessons.length}</div></div><div class="path">`;
    u.lessons.forEach((l,i)=>{
      const st=S.lessons[l.id];const isNext=next&&next.l.id===l.id;
      const cls=st&&st.done?(st.best===100?'node gold':'node done'):(isNext?'node next':'node');
      const inner=st&&st.done?(st.best===100?ICON.star:ICON.check):(i+1);
      const sub=st&&st.done?`Meilleur score : ${st.best} %`:(isNext?'À faire maintenant':`${l.q.length} questions`);
      h+=`<button class="${cls}" data-start="${l.id}"><span class="disc">${inner}</span><span><div class="t">${esc(l.title)}</div><div class="s">${sub}</div></span></button>`;
    });
    h+=`</div></section>`;
  });
  h+=`<p class="foot-note">Ta progression est enregistrée sur cet appareil. Les <a href="${FICHES_URL}">fiches détaillées</a> reprennent chaque unité avec les définitions, les tableaux et les références à citer.</p></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>{const x=allLessons().find(y=>y.l.id===b.dataset.start);startLesson(x.u,x.l,x.l.q,false);}));
  app.querySelector('[data-review]').addEventListener('click',()=>{
    const doneQ=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    const pool=doneQ.length>=12?doneQ:allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    startLesson(null,{id:'review',title:'Révision mixte'},shuffle(pool).slice(0,12),true);
  });
}

/* ---------- Moteur de leçon ---------- */
let L=null;
function startLesson(u,l,qs,isReview){
  L={u,l,isReview,queue:qs.map((q,i)=>({q,i,retry:false})),total:qs.length,idx:0,firstTry:0,seen:new Set(),wrongOnce:new Set(),wrongList:[],cur:null,answer:null,checked:false};
  nextQ();
}
function nextQ(){
  if(!L.queue.length)return finish();
  L.cur=L.queue.shift();L.answer=null;L.checked=false;renderQ();
}
function progressPct(){const solved=L.seen.size- L.queue.filter(x=>x.retry).length;return Math.max(0,Math.min(100,Math.round(((L.total-L.queue.length-(L.cur?1:0))/L.total)*100)));}
function renderQ(){
  const {q}=L.cur;const u=L.u||q._u||UNITS[0];const color=`var(${u.c})`;
  const kindName={qcm:'Choisis la bonne réponse',vf:'Vrai ou faux ?',trou:'Complète la phrase',assoc:'Associe les paires',ordre:'Remets dans l\'ordre'}[q.t];
  const done=L.total-L.queue.length-1;
  let h=`<div class="screen" style="--c:${color}"><div class="lesson"><div class="lbar"><button class="x" data-quit aria-label="Quitter la leçon">${ICON.x.replace('<svg','<svg style="width:20px;height:20px"')}</button><div class="pb"><i style="width:${Math.round(done/L.total*100)}%"></i></div><div class="cnt">${done}/${L.total}</div></div>
  <div class="kind">${L.isReview?esc(u.title)+' · ':''}${kindName}${L.cur.retry?' · à nouveau':''}</div>`;
  if(q.t==='qcm'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="opts">${L.view.opts.map((o,k)=>`<button class="opt" data-pick="${k}"><span class="k">${k+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  }else if(q.t==='vf'){
    h+=`<div class="qtext">${esc(q.q)}</div><div class="vf"><button class="opt" data-pick="1">Vrai</button><button class="opt" data-pick="0">Faux</button></div>`;
  }else if(q.t==='trou'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext" id="qt">${esc(q.q).replace('___','<span class="gap" id="gap">&nbsp;</span>')}</div><div class="bank">${L.view.opts.map((o,k)=>`<button class="chipb" data-pick="${k}">${esc(o.t)}</button>`).join('')}</div>`;
  }else if(q.t==='assoc'){
    const left=shuffle(q.p.map((p,i)=>({t:p[0],i})));const right=shuffle(q.p.map((p,i)=>({t:p[1],i})));
    L.view={left,right,pickL:null,pickR:null,matched:new Set(),errors:0};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="assoc">${left.map((o,k)=>`<button class="opt" data-l="${k}">${esc(o.t)}</button><button class="opt" data-r="${k}">${esc(right[k].t)}</button>`).join('')}</div>`;
  }else if(q.t==='ordre'){
    L.view={items:shuffle(q.items.map((t,i)=>({t,i}))),slots:[]};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="slots" id="slots"></div><div class="bank" id="bank"></div>`;
  }
  h+=`</div><div class="fb" id="fb"><div class="fb-in"><button class="btn wide" id="check" disabled>Vérifier</button></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelector('[data-quit]').addEventListener('click',quitPrompt);
  const check=document.getElementById('check');
  check.addEventListener('click',()=>{if(L.checked)nextQ();else doCheck();});
  if(q.t==='qcm'||q.t==='vf'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.answer=+b.dataset.pick;check.disabled=false;}));
  }else if(q.t==='trou'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('used'));b.classList.add('used');L.answer=+b.dataset.pick;const g=document.getElementById('gap');g.textContent=L.view.opts[L.answer].t;g.classList.add('filled');check.disabled=false;}));
  }else if(q.t==='assoc'){
    const V=L.view;
    const upd=()=>{app.querySelectorAll('[data-l]').forEach(b=>{const k=+b.dataset.l;b.classList.toggle('sel',V.pickL===k);b.classList.toggle('gone',V.matched.has('L'+k));b.disabled=V.matched.has('L'+k);});app.querySelectorAll('[data-r]').forEach(b=>{const k=+b.dataset.r;b.classList.toggle('sel',V.pickR===k);b.classList.toggle('gone',V.matched.has('R'+k));b.disabled=V.matched.has('R'+k);});};
    const tryMatch=()=>{if(V.pickL===null||V.pickR===null)return;const lb=app.querySelector(`[data-l="${V.pickL}"]`),rb=app.querySelector(`[data-r="${V.pickR}"]`);
      if(V.left[V.pickL].i===V.right[V.pickR].i){V.matched.add('L'+V.pickL);V.matched.add('R'+V.pickR);lb.classList.add('right');rb.classList.add('right');buzz(15);}
      else{V.errors++;lb.classList.add('wrong','shake');rb.classList.add('wrong','shake');buzz([30,40,30]);setTimeout(()=>{lb.classList.remove('wrong','shake');rb.classList.remove('wrong','shake');},450);}
      V.pickL=null;V.pickR=null;setTimeout(upd,V.matched.size===V.left.length*2?0:120);
      if(V.matched.size===V.left.length*2){L.answer=V.errors;setTimeout(doCheck,250);}};
    app.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickL=V.pickL===+b.dataset.l?null:+b.dataset.l;upd();tryMatch();}));
    app.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickR=V.pickR===+b.dataset.r?null:+b.dataset.r;upd();tryMatch();}));
  }else if(q.t==='ordre'){
    const V=L.view;const slots=document.getElementById('slots'),bank=document.getElementById('bank');
    const draw=()=>{slots.innerHTML=q.items.map((_,k)=>{const it=V.slots[k];return `<button class="slot ${it?'full':''}" data-s="${k}"><span class="i">${k+1}</span><span>${it?esc(it.t):''}</span></button>`;}).join('');
      bank.innerHTML=V.items.map((it,k)=>`<button class="chipb ${V.slots.some(s=>s&&s.k===k)?'used':''}" data-b="${k}" ${V.slots.some(s=>s&&s.k===k)?'disabled':''}>${esc(it.t)}</button>`).join('');
      slots.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;const k=+b.dataset.s;if(V.slots[k]){V.slots.splice(k,1);draw();}}));
      bank.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.slots.push({t:V.items[+b.dataset.b].t,i:V.items[+b.dataset.b].i,k:+b.dataset.b});draw();}));
      check.disabled=V.slots.length!==q.items.length;L.answer=V.slots.map(s=>s.i);};
    draw();
  }
}
function doCheck(){
  const {q}=L.cur;let ok=false,shown='';
  if(q.t==='qcm'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='vf'){ok=(L.answer===1)===q.a;shown=q.a?'Vrai':'Faux';app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if((k===1)===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='trou'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});const g=document.getElementById('gap');if(g){g.textContent=q.o[q.a];g.style.color=ok?'var(--ok-ink)':'var(--bad-ink)';}}
  else if(q.t==='assoc'){ok=L.answer===0;shown=L.answer===1?'une erreur d\'association':L.answer+' erreurs d\'association';}
  else if(q.t==='ordre'){ok=L.answer.every((v,k)=>v===k);shown=q.items.join(' → ');app.querySelectorAll('[data-s]').forEach((b,k)=>{b.disabled=true;b.classList.add(L.answer[k]===k?'right':'wrong');});app.querySelectorAll('[data-b]').forEach(b=>b.disabled=true);}
  L.checked=true;L.seen.add(L.cur.i);
  if(ok){buzz(20);if(!L.cur.retry)L.firstTry++;}
  else{buzz([40,60,40]);if(!L.cur.retry){L.wrongOnce.add(L.cur.i);L.wrongList.push(q);L.queue.push({q,i:L.cur.i,retry:true});}}
  const fb=document.getElementById('fb');fb.classList.add(ok?'good':'badf');
  const title=ok?['Exact !','Bien joué !','Parfait !','Oui !'][Math.floor(Math.random()*4)]:'Pas tout à fait';
  const body=ok?(q.e?esc(q.e):''):`${q.t==='assoc'?'':'<span class="ans">Réponse : '+esc(shown)+'</span><br>'}${q.e?esc(q.e):''}`;
  fb.querySelector('.fb-in').innerHTML=`<div class="msg"><div class="ic" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?ICON.check:ICON.x}</div><div><b>${title}</b><span>${body}</span></div></div><button class="btn wide ${ok?'ok':'bad'}" id="check">Continuer</button>`;
  const btn=document.getElementById('check');btn.addEventListener('click',nextQ);btn.focus({preventScroll:true});
  document.querySelector('.lbar .pb i').style.width=Math.round((L.total-L.queue.length)/L.total*100)+'%';
  document.querySelector('.lbar .cnt').textContent=(L.total-L.queue.length)+'/'+L.total;
}
function quitPrompt(){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>Quitter la leçon ?</h3><p>La progression de cette leçon ne sera pas enregistrée.</p><button class="btn wide" id="stay">Continuer la leçon</button><button class="btn ghost wide" id="leave">Quitter</button></div>`;
  document.body.appendChild(m);m.querySelector('#stay').addEventListener('click',()=>m.remove());m.querySelector('#leave').addEventListener('click',()=>{m.remove();L=null;home();});
}
function finish(){
  const acc=Math.round(L.firstTry/L.total*100);const perfect=L.wrongOnce.size===0;
  const xp=L.firstTry*10+(perfect?20:0)+(L.isReview?5:0);
  S.xp+=xp;touchStreak();
  if(!L.isReview){const prev=S.lessons[L.l.id]||{done:false,best:0};S.lessons[L.l.id]={done:true,best:Math.max(prev.best||0,acc)};}
  save();
  const color=L.u?`var(${L.u.c})`:'var(--brand)';
  const title=perfect?'Sans faute !':acc>=75?'Leçon terminée !':'Terminé, on y retourne bientôt';
  const sub=perfect?'Tu as répondu juste du premier coup à toutes les questions.':`${L.firstTry} bonne${L.firstTry>1?'s':''} réponse${L.firstTry>1?'s':''} du premier coup sur ${L.total}. Les questions manquées te sont revenues en fin de leçon.`;
  let h=`<div class="screen"><div class="result" style="--c:${color}"><div class="medal" style="border-color:${perfect?'var(--gold)':color};background:${perfect?'var(--gold-soft)':'var(--surface-2)'};color:${perfect?'var(--gold)':color}">${perfect?ICON.star:ICON.trophy}</div><h1>${title}</h1><p>${sub}</p>
  <div class="tiles"><div class="tile" style="--c:var(--gold-dark)"><div class="l">XP gagnés</div><div class="v">+${xp}</div></div><div class="tile" style="--c:${color}"><div class="l">Précision</div><div class="v">${acc} %</div></div><div class="tile" style="--c:#E0632B"><div class="l">Série</div><div class="v">${S.streak} j</div></div></div>`;
  if(L.wrongList.length){h+=`<div class="review-list"><b>À revoir dans les fiches :</b><ul>${L.wrongList.slice(0,5).map(q=>`<li>${esc(q.q.replace('___','…'))}</li>`).join('')}</ul></div>`;}
  h+=`<div class="acts">${!perfect?`<button class="btn" id="again">Refaire la leçon</button>`:''}<button class="btn ${perfect?'':'ghost'}" id="back">Continuer</button><a class="btn ghost" href="${FICHES_URL}">Ouvrir les fiches</a></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const again=document.getElementById('again');if(again)again.addEventListener('click',()=>{const u=L.u,l=L.l,r=L.isReview;const qs=r?shuffle(allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})))).slice(0,12):l.q;startLesson(u,l,qs,r);});
  document.getElementById('back').addEventListener('click',()=>{L=null;home();});
}
home();
</script>

</body>
</html>
