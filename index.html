{t:"qcm",q:"Le paradoxe de la prévention (Rose) signifie qu'elle est…",o:["peu motivante individuellement mais très bénéfique collectivement","très motivante pour chacun mais inutile collectivement","inutile dans les pays pauvres","réservée aux plus riches"],a:0,e:"Ses bénéfices sont en plus lointains, ce qui motive peu."},
{t:"vf",q:"Donner gratuitement les moustiquaires ou le chlore en diminue l'usage.",a:false,e:"Payant ou gratuit, cela ne joue pas sur l'usage."},
{t:"vf",q:"Même les plus pauvres sont prêts à dépenser beaucoup pour se faire soigner.",a:true,e:"Ils dépensent pour soigner, beaucoup moins pour prévenir."},
{t:"qcm",q:"Lequel n'est PAS un enjeu des services de santé cité en cours ?",o:["Un excès de médecins spécialistes","L'absentéisme des professionnels de santé","Des injections et antibiotiques mal utilisés (antibiorésistance)","Des infirmières qui ne croient pas aux traitements qu'elles délivrent"],a:0,e:"Le cours cite aussi le manque de régulation, de formation et de connaissances."},
{t:"qcm",q:"Quel effet des incitations financières ou matérielles sur la prévention ?",o:["Elles réduisent la procrastination et font passer de l'intention à l'action","Elles n'ont aucun effet","Elles découragent toujours","Elles ne marchent que chez les riches"],a:0,e:"Mais elles posent un biais moral : c'est un des dilemmes de ces stratégies."},
{t:"qcm",q:"Quelle question termine la réflexion du chapitre ?",o:["Quels dilemmes moraux posent les incitations et l'architecture des choix ?","Faut-il supprimer la prévention ?","Faut-il privatiser les soins ?","La vaccination est-elle utile ?"],a:0,e:"Les sept questions : lien santé-pauvreté, motivation, indifférence supposée des pauvres, services, incitations, architecture des choix, dilemmes moraux."}]}
]},
{id:"u10",n:10,c:"--u10",title:"Complexité et santé communautaire",who:"Eric Breton · cours 2 · Jourdan et al. 2012 · Dasgupta 2021",lessons:[
{id:"u10l1",title:"Simple, compliqué, complexe",q:[
{t:"assoc",q:"Associe chaque exemple au type de problème (Westley et al., 2007).",p:[["Faire un gâteau","simple"],["Envoyer une fusée sur la lune","compliqué"],["Élever un enfant","complexe"]],e:"Complexe = imprévisible : les mêmes façons de faire n'auront pas forcément les mêmes effets."},
{t:"qcm",q:"Face à un problème complexe, les protocoles rigides sont…",o:["limités ou contre-productifs","essentiels","nécessaires et suffisants","toujours efficaces"],a:0,e:"Pour le gâteau, la recette est essentielle ; pour la fusée, les protocoles rigides sont nécessaires."},
{t:"qcm",q:"Que montre le murmure d'étourneaux ?",o:["Un comportement collectif sans chef : chaque oiseau ajuste sa trajectoire à celle des autres","Un groupe dirigé par l'oiseau le plus âgé","Un système fermé et prévisible","Un comportement appris par imitation d'un leader"],a:0,e:"« There is no leader in a murmuration. » Un système ouvert, influencé par l'extérieur (prédateurs, nourriture)."},
{t:"qcm",q:"Laquelle n'est PAS une propriété d'un système complexe adaptatif (Durie & Wyatt, 2013) ?",o:["Il est prévisible à partir de ses composantes","Il est le produit des relations entre ses composantes","Il est lié à des boucles de rétroaction positives et négatives","Il est sensible à son état initial"],a:0,e:"Il est imprévisible, influencé par l'environnement et s'adapte continuellement."},
{t:"trou",q:"Les nouveaux comportements imprévisibles d'un système complexe sont dits ___.",o:["émergents","linéaires","planifiés","fermés"],a:0,e:"Deux personnes semblables peuvent s'entendre ou non : la connexion ne se prédit pas."},
{t:"qcm",q:"Quel exemple de système fermé Breton donne-t-il ?",o:["Le moteur thermique d'une voiture, qui maintient sa pression interne","Un quartier","Une nuée d'étourneaux","Une famille"],a:0,e:"Son ouverture vers l'extérieur est limitée ; si un système pouvait être isolé, on aurait plus de certitude."},
{t:"vf",q:"Selon la science de la complexité, le changement d'un système peut être dirigé de l'extérieur.",a:false,e:"Il résulte des interactions et relations auto-organisées au sein du système (Durie & Wyatt, 2013)."},
{t:"ordre",q:"Remets dans l'ordre la boucle de rétroaction positive des aliments ultra-transformés.",items:["Ajout de sel, de sucre et de gras","Attractivité accrue du produit","Hausse des ventes et des profits","Nouvel ajout de sel, de sucre et de gras"],e:"Une boucle positive s'auto-entretient : elle dégrade les qualités nutritives."}]},
{id:"u10l2",title:"Penwerris et les leviers du changement",q:[
{t:"qcm",q:"En 1995, la circonscription de Penwerris (6 000 habitants) est…",o:["la plus pauvre de Cornouailles : 8 hommes sur 10 sans emploi, plus de la moitié des logements sans chauffage central","un quartier aisé de Londres","une commune rurale française","un quartier sans problème de santé"],a:0,e:"Morbidité supérieure de 18 % à la moyenne nationale (Durie & Wyatt, 2007)."},
{t:"qcm",q:"Entre 1995 et 2000, quel résultat est observé à Penwerris ?",o:["Dépressions post-natales en baisse de 70 % et criminalité divisée par deux","Hausse du chômage","Aucun changement","Fermeture des écoles"],a:0,e:"Aussi : chômage -71 %, enfants placés -42 %, réussite scolaire des garçons de 10-11 ans doublée, plus aucune grossesse adolescente indésirable signalée en 1999."},
{t:"qcm",q:"Qui a joué le rôle clé à Penwerris ?",o:["Deux infirmières de PMI (health visitors) qui ont mobilisé et appuyé les acteurs du territoire","Le ministère de la Santé","Une entreprise privée","Un hôpital universitaire"],a:0,e:"Elles venaient à chaque naissance et connaissaient la communauté ; tout a commencé par des sujets simples comme les déjections canines."},
{t:"vf",q:"Le cas de Penwerris montre que l'amélioration de la santé peut se faire sans actions sur la santé.",a:true,e:"Les nouvelles connexions entre habitants ont permis des initiatives imprévisibles. On peut se demander si l'État sait financer ce type d'action."},
{t:"ordre",q:"Leviers d'intervention dans un système (Meadows, 1999) : classe-les du plus efficace au moins efficace.",items:["Le pouvoir de transcender les paradigmes","Les objectifs du système","Les règles du système (incitations, punitions, contraintes)","Les constantes et paramètres (subventions, taxes, normes)"],e:"Meadows liste 12 leviers : les chiffres sont les moins puissants, les paradigmes les plus puissants."},
{t:"qcm",q:"Selon Hawe (2015), les concepteurs d'interventions complexes donnent aux praticiens…",o:["un maximum d'informations sur le but et un minimum de spécifications sur la manière d'y parvenir","un protocole détaillé à suivre à la lettre","aucune information sur le but","uniquement des indicateurs chiffrés"],a:0,e:"Pour favoriser l'apprentissage et tirer vite bénéfice de l'innovation et de l'échec."},
{t:"qcm",q:"Pourquoi le leadership « dispersé » (les « leaders de la danse ») compte-t-il ?",o:["Il ajoute de la résilience aux réseaux communautaires et rend les retombées pérennes","Il concentre le pouvoir chez un chef","Il supprime le besoin de coordination","Il remplace les professionnels"],a:0,e:"Il remet en question les modèles dominants de leadership (Durie & Wyatt, 2013)."},
{t:"qcm",q:"Que reprochent Durie & Wyatt à l'approche de la santé fondée sur les déficits ?",o:["Elle suppose des communautés incompétentes qui ont besoin d'experts, et crée une classe professionnelle séparée des communautés","Elle coûte trop cher","Elle s'intéresse trop aux actifs","Elle ignore les professionnels"],a:0,e:"Ces experts forment un système fermé ; C2 « m'a rappelé pourquoi je voulais travailler dans le secteur public »."}]},
{id:"u10l3",title:"Quarante ans après (Jourdan)",q:[
{t:"qcm",q:"Pour Bourdieu, cité par Jourdan et al. (2012), un champ est…",o:["un espace structuré de relations où des acteurs luttent pour des capitaux (économiques, culturels, symboliques)","un domaine scientifique aux frontières fixes","une zone géographique","une discipline universitaire"],a:0,e:"Santé communautaire et santé publique sont deux domaines du champ sociosanitaire."},
{t:"qcm",q:"Dans le modèle de Jourdan et al., comment se positionnent les deux domaines ?",o:["La santé publique, quasi verticale, près du pôle sanitaire ; la santé communautaire, à 45°, à l'interaction du sanitaire et du social","Les deux se confondent entièrement","La santé communautaire est au pôle sanitaire","La santé publique est au pôle social"],a:0,e:"Les frontières sont en pointillés : elles bougent selon les sociétés, les époques et le jeu des acteurs."},
{t:"qcm",q:"Qu'est-ce qui distingue la santé communautaire de la santé publique ?",o:["Un rapport au social marqué par la participation et l'insertion dans une démarche de développement","Le fait d'avoir une dimension sociale, que la santé publique n'a pas","Un corpus de savoirs propre","Le financement par l'État"],a:0,e:"La santé publique aussi s'ouvre au social ; ce qui compte, c'est la nature du rapport au social."},
{t:"trou",q:"On assiste à une ___ du social : les violences et l'échec scolaire deviennent des pathologies à prendre en charge médicalement.",o:["sanitarisation","socialisation","privatisation","démédicalisation"],a:0,e:"Elle ouvre largement la santé publique sur le social."},
{t:"ordre",q:"France : remets dans l'ordre les étapes de la santé communautaire.",items:["Avant 1983 : municipalités et associations dans un État centralisé","1983 : décentralisation, contrats de ville, développement social des quartiers","1998 : loi contre les exclusions, ateliers santé ville","2009 : loi HPST et contrats locaux de santé"],e:"La loi de santé publique de 2004 ignore encore la santé communautaire."},
{t:"qcm",q:"Au Québec, que se passe-t-il en 1993 ?",o:["Une réorganisation fait revenir l'expression « santé publique » : la santé communautaire n'avait pas su orienter les services face au curatif","La santé communautaire est créée","Les CLSC sont supprimés","Le Québec adopte le modèle français"],a:0,e:"Au début des années 1970, la santé communautaire y avait remplacé la santé publique. Mouvement inverse de la France."},
{t:"vf",q:"En France, la notion de santé communautaire a été disqualifiée comme mode « post-1968 » ou comme communautarisme dangereux.",a:true,e:"Elle n'existe que par des initiatives locales, en milieu défavorisé, avec le secteur associatif (Institut Renaudot)."},
{t:"qcm",q:"Quelle est la conclusion de Jourdan et al. ?",o:["Plutôt que « la » santé communautaire avec ses structures, émerge « l'approche communautaire », un « faire » (Fassin) des acteurs publics","La santé communautaire a disparu","La santé communautaire a remplacé la santé publique","Il faut créer des institutions de santé communautaire"],a:0,e:"D'où la définition de l'intervenant comme le pédagogue de Meirieu."}]},
{id:"u10l4",title:"Sonagachi (Dasgupta)",q:[
{t:"qcm",q:"Le projet Sonagachi, c'est…",o:["un programme de réduction des risques VIH et IST lancé en 1991 à Kolkata, mené par les travailleuses du sexe depuis 1995","une campagne nationale de dépistage en Inde","un hôpital pour travailleuses du sexe","un programme de réhabilitation hors de la prostitution"],a:0,e:"Plus de 50 000 travailleurs du sexe dans l'un des plus grands quartiers de prostitution d'Asie du Sud."},
{t:"trou",q:"Le syndicat des travailleuses du sexe né du projet s'appelle le ___.",o:["DMSC (Durbar Mahila Samanwaya Committee)","Usha","Avahan","Soul City"],a:0,e:"Usha est la coopérative bancaire ; Avahan un programme financé par la Fondation Gates ; Soul City une initiative sud-africaine."},
{t:"qcm",q:"Quelle méthode utilise Dasgupta ?",o:["37 entretiens semi-structurés en bengali, analysés par théorie ancrée (codage ouvert puis axial)","Un essai randomisé contrôlé","Un questionnaire en ligne","Une analyse de données hospitalières"],a:0,e:"Précédés de deux mois sur place et d'une observation participante."},
{t:"qcm",q:"Pourquoi les travailleuses préfèrent-elles la sensibilisation par les pairs ?",o:["Méfiance envers les extérieurs (ONG, soignants, cinéastes), empathie des pairs et proximité : l'éducatrice paire est là à 21 h","Les pairs sont mieux payés","Les médecins refusent de venir","La loi l'impose"],a:0,e:"« Nos pairs, c'est nous. » Les ONG veulent « sauver et réhabiliter », les travailleuses demandent le respect de leurs droits."},
{t:"qcm",q:"À quoi sert la négociation avec les parties prenantes (police, proxénètes, propriétaires, partis) ?",o:["Réduire la violence et rendre le projet durable, en présentant la santé des travailleuses comme leur intérêt économique","Obtenir l'interdiction de la prostitution","Remplacer les pairs","Financer les ONG"],a:0,e:"Impliquer les plus puissants est une contradiction nécessaire (Cornish et al., 2007)."},
{t:"qcm",q:"La coopérative Usha, créée en 1995 par six travailleuses du sexe…",o:["accorde des microcrédits pour échapper aux chit funds et aux usuriers (dadan, de 72 à 720 % par an)","vend uniquement des préservatifs","est gérée par l'État","prête aux entreprises locales"],a:0,e:"Enregistrée comme coopérative de travailleuses du sexe (et non de « femmes au foyer ») : une étape vers la reconnaissance."},
{t:"qcm",q:"Quelle est la principale limite de l'étude ?",o:["Un biais de sélection : les personnes interrogées, choisies par le DMSC, en sont presque toutes membres (30 sur 37)","Un échantillon trop grand","L'absence d'autorisation éthique","Des entretiens trop courts"],a:0,e:"L'avis des parties prenantes extérieures n'a pas non plus été recueilli."},
{t:"vf",q:"Pour Dasgupta, promouvoir la santé d'une population marginalisée consiste surtout à transmettre de l'information.",a:false,e:"Il faut aussi permettre à la communauté de s'organiser, de participer, de négocier et de gagner en autonomie sociale et économique."}]}
]},
{id:"u11",n:11,c:"--u11",title:"Participation et empowerment",who:"Eric Le Grand · séquence 5",lessons:[
{id:"u11l1",title:"Pourquoi et comment participer",q:[
{t:"vf",q:"Les politiques publiques françaises et européennes encouragent la participation, mais dans les actions c'est plus difficile.",a:true,e:"« Une volonté sur le papier. »"},
{t:"qcm",q:"Laquelle n'est PAS une raison citée pour insister sur la participation ?",o:["Réduire le coût des programmes","Le lien avec la démocratie","Le savoir d'expérience des personnes","Le lien social : une personne citoyenne à part entière"],a:0,e:"Quatrième raison : la participation comme levier d'amélioration des politiques publiques."},
{t:"qcm",q:"Pourquoi la participation est-elle difficile pour les professionnels ?",o:["Elle ne s'improvise pas : il faut accepter de partager le pouvoir, changer de posture, et c'est rarement enseigné","Elle est interdite par la loi","Les publics refusent toujours","Elle ne demande aucun temps"],a:0,e:"Le système est fait de prises en charge individuelles ; il faut aller vers et accepter que l'autre a des savoirs."},
{t:"qcm",q:"Comment la participation peut-elle renforcer les inégalités sociales ?",o:["Si l'on ignore l'accessibilité : ce sont toujours les mêmes qui viennent (ex. : garde d'enfants lors des réunions)","Elle ne peut jamais les renforcer","En donnant trop la parole aux plus pauvres","En supprimant les professionnels"],a:0,e:"Savoir d'où partent les personnes et ne pas fixer d'objectifs démesurés."},
{t:"vf",q:"Le droit de ne pas participer existe aussi.",a:true,e:"Sursolliciter les gens peut être épuisant ; aujourd'hui la participation devient une injonction."},
{t:"qcm",q:"Quelles sont les trois dimensions du lien social citées ?",o:["La protection, les ressources, la reconnaissance","L'argent, le travail, la famille","La loi, l'école, la santé","L'individu, le groupe, l'État"],a:0,e:"De quelle façon la société nous lie-t-elle ?"},
{t:"qcm",q:"Lequel n'est PAS un des quatre enjeux de la participation ?",o:["La rentabilité","La citoyenneté","Le pouvoir","Le savoir"],a:0,e:"Quatrième : la connaissance. La santé est une composante de la vie de la cité, pas réservée aux professionnels."},
{t:"qcm",q:"Quels effets « prouvés » de la participation le cours retient-il ?",o:["Estime et confiance en soi, compétences psychosociales, capital social, parfois partage de pouvoir","Baisse immédiate de la mortalité","Aucun effet démontré","Hausse des revenus"],a:0,e:"Mais certaines trajectoires individuelles peuvent rejeter la participation."}]},
{id:"u11l2",title:"Les jeunes et la PJJ",q:[
{t:"qcm",q:"Pourquoi la participation des jeunes en santé est-elle ambiguë ?",o:["Ils veulent participer mais se sentent stigmatisés, évitent les structures de santé et on leur fait peu confiance","Ils ne veulent jamais participer","La loi l'interdit avant 18 ans","Ils n'ont aucun savoir en santé"],a:0,e:"Historiquement, ce sont pourtant eux qui bousculent les codes (sécurité routière, Sidaction)."},
{t:"qcm",q:"Les jeunes de la PJJ (protection judiciaire de la jeunesse) sont…",o:["des mineurs sous mesure judiciaire, avec un cumul de vulnérabilités et une méfiance institutionnelle","des étudiants en santé","des jeunes majeurs en emploi","des lycéens sans difficulté"],a:0,e:"Prise en charge de 3 à 6 mois, en structure ouverte ou fermée ; la santé comme levier éducatif d'insertion."},
{t:"assoc",q:"Associe chaque terrain d'expérimentation à son action.",p:[["Grand Est","éducation pour la santé par les pairs"],["Bourgogne","travail autour de la radio"]],e:"Éviter une démarche descendante inadaptée."},
{t:"qcm",q:"Quelle adaptation au public le cours cite-t-il ?",o:["Ne pas dépasser une demi-heure d'activité, sinon l'attention se perd","Des séances de trois heures","Des cours magistraux","Des questionnaires écrits longs"],a:0,e:"Autres difficultés : la mobilisation dans le temps et la dynamique collective (dur de parler de soi)."},
{t:"assoc",q:"Associe chaque tendance de la participation des jeunes à ce qu'elle sert.",p:[["Les jeunes choisissent leurs thèmes et font valoir leurs droits","l'émancipation"],["Des jeunes « ambassadeurs » tabac ou santé mentale sans marge de manœuvre","un moyen, voire une instrumentalisation"]],e:"« N'en fait-on pas des perroquets ? » Participation comme moyen ou comme empowerment : pas les mêmes modalités."},
{t:"vf",q:"Développer la participation permet aux professionnels de se désengager.",a:false,e:"La participation est très impliquante : l'accompagnement reste nécessaire."},
{t:"qcm",q:"Quel outil le cours cite-t-il pour évaluer la participation communautaire ?",o:["Le diagramme de Rifkin, pour situer la démarche et sa temporalité","La matrice ROI","Le modèle COM-B","L'échelle de Gordon"],a:0,e:"On évalue aussi les capacités développées par les personnes et l'impact sur l'environnement."},
{t:"qcm",q:"Lequel n'est PAS un point d'attention cité ?",o:["Hiérarchiser les propositions des publics selon l'avis des experts","Donner un retour rapide sur les effets de la participation","Prendre au sérieux les propositions des publics","Prévoir des outils d'évaluation de la participation"],a:0,e:"Au contraire : partir des dynamiques des publics, sans hiérarchisation."}]},
{id:"u11l3",title:"Empowerment et milieu carcéral",q:[
{t:"qcm",q:"Quelle définition de l'empowerment le cours donne-t-il ?",o:["Un processus d'action sociale par lequel individus, communautés et organisations acquièrent la maîtrise de leur vie en changeant leur environnement social et politique","Un programme d'éducation individuelle","Une prime versée aux participants","Une loi sur la participation"],a:0,e:"Pour accroître l'équité et améliorer la qualité de vie."},
{t:"qcm",q:"Une littératie en santé insuffisante est une barrière à l'empowerment…",o:["non formelle","formelle","juridique","financière"],a:0,e:"Une barrière formelle serait un texte de loi décidant qu'une personne n'a pas droit à l'eau. Ces barrières sont peu prises en compte en France."},
{t:"qcm",q:"Laquelle n'est PAS une stratégie d'empowerment citée ?",o:["Renforcer le contrôle des institutions sur les personnes","Accroître les compétences des citoyens","Favoriser les petits groupes pour accroître la conscience critique","S'appuyer sur des leaders (les « populaires » à l'école)"],a:0,e:"Et accroître l'accès aux ressources et aux informations."},
{t:"assoc",q:"Associe chaque nouvelle stratégie à sa description.",p:[["Community organizing","porte-à-porte pour améliorer un sujet du quartier (Alliance citoyenne)"],["Démarches communautaires","actions portées par des associations comme Médecins du monde"],["Community building","partir d'opportunités sur des questions collectives pour développer des compétences sociales"]],e:"Toutes visent l'amélioration des conditions de vie."},
{t:"qcm",q:"Que dit la citation de Bernard Sachs en conclusion du cours ?",o:["L'appel à la participation pourrait masquer l'impuissance collective à traiter les fractures sociales","La participation règle toutes les inégalités","Il faut rendre la participation obligatoire","La participation est inutile"],a:0,e:"D'où l'insistance sur une participation volontaire."},
{t:"qcm",q:"Que prévoit la loi de 1994 pour la santé en prison ?",o:["La séparation des unités sanitaires et de l'administration pénitentiaire, pour l'équité et la confidentialité","La fermeture des infirmeries","La gestion de la santé par les surveillants","L'interdiction de la prévention"],a:0,e:"Le 7 septembre 2023, un texte développe la promotion de la santé et la participation en milieu carcéral."},
{t:"vf",q:"Le taux de suicide est particulièrement élevé au début de l'incarcération.",a:true,e:"Les détenus ont aussi plus de VIH, de troubles psychiatriques et d'addictions ; « la prison rend fou »."},
{t:"qcm",q:"Comment la participation est-elle perçue en milieu pénitentiaire ?",o:["Avec suspicion : le collectif est vu comme un danger pour l'ordre de l'établissement","Comme une priorité absolue","Comme une obligation légale respectée","Elle y est inconnue"],a:0,e:"La France est en retard ; le projet Prisca part des représentations des détenus et des surveillants."}]}
]},
{id:"u12",n:12,c:"--u12",title:"Marketing social critique et lobbying",who:"Philémon Aurouet & Diane Geindreau · cours 2",lessons:[
{id:"u12l1",title:"Déterminants commerciaux et loi Evin",q:[
{t:"qcm",q:"Le marketing social critique étudie…",o:["la concurrence faite aux comportements favorables à la santé, surtout par les industries de produits à risque (tabac, alcool, pesticides)","les ventes des entreprises de santé","la publicité des campagnes de prévention","les comportements des professionnels de santé"],a:0,e:"Et l'effet du marketing et du lobbying sur les consommateurs et les leaders d'opinion (Hastings, 2022)."},
{t:"ordre",q:"Remets dans l'ordre les trois axes du marketing social critique.",items:["Observer et recenser les activités des industriels","Mener des recherches sur leurs effets et sur les contre-mesures","Informer les acteurs de santé, les politiques et l'opinion"],e:"Exemple de contre-marketing testé : le paquet neutre."},
{t:"qcm",q:"Quelles quatre industries provoquent environ un tiers des décès mondiaux (≈ 19 millions en 2019) ?",o:["Tabac, alcool, aliments ultra-transformés, énergies fossiles","Tabac, automobile, pharmacie, textile","Alcool, jeux d'argent, sucre, cosmétiques","Pétrole, acier, chimie, agriculture"],a:0,e:"En Europe, elles causent un quart des décès chaque année. On parle d'« épidémies industrielles » (Stuckler, 2012)."},
{t:"trou",q:"« Doubt is our product » : la phrase vient d'un cadre de ___.",o:["RJ Reynolds Tobacco","Coca-Cola","Pernod Ricard","ExxonMobil"],a:0,e:"Le doute est le meilleur moyen de concurrencer les faits établis dans l'esprit du public."},
{t:"qcm",q:"Selon la HATVP, le lobbying consiste à…",o:["prendre l'initiative d'entrer en contact avec les décideurs publics pour influencer leurs décisions","financer une campagne électorale","publier une étude scientifique","vendre un produit à l'État"],a:0,e:"Rencontres, appels, courriers, interpellations sur les réseaux sociaux ; tout est déclaré dans un registre de transparence."},
{t:"assoc",q:"Loi Evin (1991) : associe chaque mesure phare à son contenu.",p:[["Limiter l'exposition","interdire la publicité pour l'alcool dans les médias qui ciblent les jeunes"],["Réglementer le contenu","seulement des informations objectives : degré, origine, composition"],["Avertissement sanitaire","« L'abus d'alcool est dangereux pour la santé » sur toute publicité"]],e:"Une cinquantaine de pays ont suivi l'exemple français."},
{t:"qcm",q:"Qu'est devenue la loi Evin depuis 1991 ?",o:["Elle a été affaiblie par de nombreux assouplissements (lois, jurisprudence)","Elle a été renforcée chaque année","Elle a été abrogée","Elle est restée identique"],a:0,e:"En 2016, les boissons d'appellation d'origine, de terroir ou d'héritage culturel échappent aux restrictions. 29,8 % des élèves de 17 ans voient des publicités pour l'alcool presque tous les jours."},
{t:"qcm",q:"Ajouter « À consommer avec modération » à l'avertissement sanitaire, c'est pour l'industrie…",o:["une stratégie pour réduire l'efficacité de l'avertissement","une mesure de santé publique","une obligation européenne","un geste sans effet"],a:0,e:"Thèse d'Ana Millot (18 leaders d'opinion) : proposer des politiques alternatives (RSE, campagnes de prévention) plutôt que la régulation."}]},
{id:"u12l2",title:"Taxes sur le tabac et playbook des industries",q:[
{t:"qcm",q:"Selon l'OMS, dans un pays à revenu élevé, une hausse de 10 % du prix du tabac…",o:["diminuerait de 4 % la prévalence de la consommation","n'aurait aucun effet","diminuerait de 40 % la prévalence","augmenterait la consommation"],a:0,e:"À condition de hausses d'au moins 10 %, répétées dans le temps ; l'effet est plus fort chez les jeunes et les précaires."},
{t:"vf",q:"Sous 10 %, une hausse de prix pénalise le pouvoir d'achat des fumeurs et enrichit l'industrie du tabac.",a:true,e:"D'où le « stop and go » français à expliquer."},
{t:"qcm",q:"L'étude FELITAF de la presse généraliste (2000-2020) a relevé…",o:["5 409 articles et 8 015 arguments, dont 64,3 % contre la hausse des taxes","une majorité d'arguments favorables","une dizaine d'articles","aucun argument de l'industrie"],a:0,e:"Arguments contre : inefficacité, marché noir, préjudice aux buralistes, mesure injuste et régressive."},
{t:"qcm",q:"Qui s'exprime le plus dans la presse contre les hausses de taxes ?",o:["Les buralistes (2 368 arguments : marché noir, préjudice aux buralistes)","Les médecins","Les fumeurs","Les ministres"],a:0,e:"Les acteurs de santé publique : 853 arguments, favorables mais minoritaires et moins audibles."},
{t:"qcm",q:"Quelle est la spécificité du marché français du tabac ?",o:["24 000 buralistes au monopole des ventes, à la fois préposés de l'administration et commerçants indépendants","Une vente libre en supermarché","Un monopole d'État sans commerçants","Une vente uniquement en pharmacie"],a:0,e:"41 % sont installés dans des communes de moins de 3 500 habitants ; la France est frontalière de pays moins chers."},
{t:"qcm",q:"Quelle recommandation tire la recherche FELITAF ?",o:["Clarifier le statut des buralistes au regard de l'article 5.3 de la CCLAT et structurer la stratégie médiatique","Baisser les taxes","Interdire les buralistes","Laisser l'industrie financer la prévention"],a:0,e:"Préposés de l'administration, ils ne devraient pas avoir de liens avec l'industrie du tabac ; dénoncer le non-respect des lois (vente aux mineurs)."},
{t:"qcm",q:"À quoi sert la taxonomie d'Ulucanlar et al. (2023) ?",o:["Classer les arguments et stratégies d'influence des industries (tabac, alcool, alimentation, jeux d'argent) pour outiller la santé publique","Mesurer la consommation d'alcool","Classer les maladies chroniques","Évaluer les campagnes de prévention"],a:0,e:"Appliquée au plan de prévention proposé par les alcooliers en 2018 (2 millions d'euros sur 2019-2022)."},
{t:"qcm",q:"Laquelle n'est PAS une réponse au lobbying citée en cours ?",o:["Laisser les industriels financer la recherche publique","La transparence et l'accès aux documents","La mobilisation des ONG (Corporate Europe Observatory)","Une recherche libre et indépendante financée par l'argent public"],a:0,e:"Aussi : participer aux consultations publiques, faire de la veille et du contre-lobbying (PFAS)."}]}
]},
{id:"u13",n:13,c:"--u13",title:"Inégalités sociales et prévention",who:"Antoine Flahault (L'Express, 2026) · Currie, Schwandt & Thuilliez (Le Monde, 2018)",lessons:[
{id:"u13l1",title:"La prévention, angle mort",q:[
{t:"trou",q:"Selon Antoine Flahault, la prévention ne représente que ___ des dépenses de santé en France.",o:["2,6 %","15 %","26 %","0,2 %"],a:0,e:"Les notes du cours de Raude donnent « environ 5 % » : citer la source avec le chiffre."},
{t:"qcm",q:"Pour Flahault, l'échec de la prévention tient surtout à…",o:["l'inéquité sociale qui la parcourt","sa mauvaise communication","son coût trop élevé","l'ignorance du public"],a:0,e:"Tabac, obésité, diabète, alcool, dépistages : presque toutes les maladies qu'on sait prévenir suivent un gradient social."},
{t:"qcm",q:"Selon Flahault, les diplômés de l'université ont, par rapport aux non-diplômés…",o:["quatre à cinq fois moins de risque de développer une démence de type Alzheimer","autant de risque","deux fois plus de risque","un risque nul"],a:0,e:"Les hommes diplômés vivent près de 9 ans de plus en bonne santé (6 ans chez les femmes)."},
{t:"qcm",q:"La « compression de morbidité », c'est…",o:["la prévention qui retarde et atténue les maladies chroniques, et allonge la vie sans maladie grave","la baisse du nombre de médecins","la réduction des dépenses hospitalières","l'allongement de la vie avec des maladies chroniques"],a:0,e:"L'inverse est l'« expansion de morbidité » : vivre longtemps mais malade."},

const KEY="hygee.v1";
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')return Object.assign({xp:0,streak:0,last:null,lessons:{}},o);}}catch(e){}return{xp:0,streak:0,last:null,lessons:{}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function touchStreak(){const t=today();if(S.last===t)return;const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak=(S.last===ys)?S.streak+1:1;S.last=t;}
function streakAlive(){if(!S.last)return false;const t=today();const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();return S.last===t||S.last===ys;}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const buzz=p=>{try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}};

};
const allLessons=()=>UNITS.flatMap(u=>u.lessons.map(l=>({u,l})));

/* ---------- Écran d'accueil ---------- */
function home(){
  const total=allLessons().length;const done=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).length;
  const next=allLessons().find(x=>!(S.lessons[x.l.id]&&S.lessons[x.l.id].done));
  let h=`<div class="screen"><header class="hdr"><div class="logo">${ICON.cup.replace('viewBox','style="color:var(--brand)" viewBox')}Hygée</div><div class="stats"><div class="stat fire" title="Jours d'affilée">${ICON.fire}${streakAlive()?S.streak:0}</div><div class="stat xp" title="Points d'expérience">${ICON.bolt}${S.xp}</div></div></header>
  <div class="home">
  <section class="hero"><h1>UE2 · Prévention et promotion de la santé</h1><p>Treize unités tirées des cours de l'EHESP (Raude, Breton, Geindreau, Aurouet, Fèvre, Le Grand) et des lectures (CCNDS, Jourdan, Dasgupta, Flahault, Currie). Chaque leçon dure trois à cinq minutes et te fait gagner des points.</p>
  <div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="prog-l">${done} leçon${done>1?'s':''} sur ${total} terminée${done>1?'s':''}</div>
  <div class="row" style="margin-top:12px">${next?`<button class="btn" data-start="${next.l.id}">${done?'Continuer':'Commencer'}</button>`:''}<button class="btn ghost" data-review="1">Révision mixte</button><a class="btn ghost" href="${FICHES_URL}">Fiches détaillées</a></div></section>`;
  UNITS.forEach(u=>{
    const ld=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].done).length;
    const gold=u.lessons.filter(l=>S.lessons[l.id]&&S.lessons[l.id].best===100).length;
    h+=`<section class="unit" style="--c:var(${u.c});--cd:var(${u.c}d)"><div class="unit-h"><div><div class="n">Unité ${u.n}</div><h2>${esc(u.title)}</h2><div class="who">${esc(u.who)}</div></div><div class="crown">${ICON.star}${gold}/${u.lessons.length}</div></div><div class="path">`;
    u.lessons.forEach((l,i)=>{
      const st=S.lessons[l.id];const isNext=next&&next.l.id===l.id;
      const cls=st&&st.done?(st.best===100?'node gold':'node done'):(isNext?'node next':'node');
      const inner=st&&st.done?(st.best===100?ICON.star:ICON.check):(i+1);
      const sub=st&&st.done?`Meilleur score : ${st.best} %`:(isNext?'À faire maintenant':`${l.q.length} questions`);
      h+=`<button class="${cls}" data-start="${l.id}"><span class="disc">${inner}</span><span><div class="t">${esc(l.title)}</div><div class="s">${sub}</div></span></button>`;
    });
    h+=`</div></section>`;
  });
  h+=`<p class="foot-note">Ta progression est enregistrée sur cet appareil. Les <a href="${FICHES_URL}">fiches détaillées</a> reprennent chaque unité avec les définitions, les tableaux et les références à citer.</p></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>{const x=allLessons().find(y=>y.l.id===b.dataset.start);startLesson(x.u,x.l,x.l.q,false);}));
  app.querySelector('[data-review]').addEventListener('click',()=>{
    const doneQ=allLessons().filter(x=>S.lessons[x.l.id]&&S.lessons[x.l.id].done).flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    const pool=doneQ.length>=12?doneQ:allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})));
    startLesson(null,{id:'review',title:'Révision mixte'},shuffle(pool).slice(0,12),true);
  });
}

/* ---------- Moteur de leçon ---------- */
let L=null;
function startLesson(u,l,qs,isReview){
  L={u,l,isReview,queue:qs.map((q,i)=>({q,i,retry:false})),total:qs.length,idx:0,firstTry:0,seen:new Set(),wrongOnce:new Set(),wrongList:[],cur:null,answer:null,checked:false};
  nextQ();
}
function nextQ(){
  if(!L.queue.length)return finish();
  L.cur=L.queue.shift();L.answer=null;L.checked=false;renderQ();
}
function progressPct(){const solved=L.seen.size- L.queue.filter(x=>x.retry).length;return Math.max(0,Math.min(100,Math.round(((L.total-L.queue.length-(L.cur?1:0))/L.total)*100)));}
function renderQ(){
  const {q}=L.cur;const u=L.u||q._u||UNITS[0];const color=`var(${u.c})`;
  const kindName={qcm:'Choisis la bonne réponse',vf:'Vrai ou faux ?',trou:'Complète la phrase',assoc:'Associe les paires',ordre:'Remets dans l\'ordre'}[q.t];
  const done=L.total-L.queue.length-1;
  let h=`<div class="screen" style="--c:${color}"><div class="lesson"><div class="lbar"><button class="x" data-quit aria-label="Quitter la leçon">${ICON.x.replace('<svg','<svg style="width:20px;height:20px"')}</button><div class="pb"><i style="width:${Math.round(done/L.total*100)}%"></i></div><div class="cnt">${done}/${L.total}</div></div>
  <div class="kind">${L.isReview?esc(u.title)+' · ':''}${kindName}${L.cur.retry?' · à nouveau':''}</div>`;
  if(q.t==='qcm'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="opts">${L.view.opts.map((o,k)=>`<button class="opt" data-pick="${k}"><span class="k">${k+1}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`;
  }else if(q.t==='vf'){
    h+=`<div class="qtext">${esc(q.q)}</div><div class="vf"><button class="opt" data-pick="1">Vrai</button><button class="opt" data-pick="0">Faux</button></div>`;
  }else if(q.t==='trou'){
    L.view={opts:shuffle(q.o.map((t,i)=>({t,i})))};
    h+=`<div class="qtext" id="qt">${esc(q.q).replace('___','<span class="gap" id="gap">&nbsp;</span>')}</div><div class="bank">${L.view.opts.map((o,k)=>`<button class="chipb" data-pick="${k}">${esc(o.t)}</button>`).join('')}</div>`;
  }else if(q.t==='assoc'){
    const left=shuffle(q.p.map((p,i)=>({t:p[0],i})));const right=shuffle(q.p.map((p,i)=>({t:p[1],i})));
    L.view={left,right,pickL:null,pickR:null,matched:new Set(),errors:0};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="assoc">${left.map((o,k)=>`<button class="opt" data-l="${k}">${esc(o.t)}</button><button class="opt" data-r="${k}">${esc(right[k].t)}</button>`).join('')}</div>`;
  }else if(q.t==='ordre'){
    L.view={items:shuffle(q.items.map((t,i)=>({t,i}))),slots:[]};
    h+=`<div class="qtext">${esc(q.q)}</div><div class="slots" id="slots"></div><div class="bank" id="bank"></div>`;
  }
  h+=`</div><div class="fb" id="fb"><div class="fb-in"><button class="btn wide" id="check" disabled>Vérifier</button></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  app.querySelector('[data-quit]').addEventListener('click',quitPrompt);
  const check=document.getElementById('check');
  check.addEventListener('click',()=>{if(L.checked)nextQ();else doCheck();});
  if(q.t==='qcm'||q.t==='vf'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');L.answer=+b.dataset.pick;check.disabled=false;}));
  }else if(q.t==='trou'){
    app.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;app.querySelectorAll('[data-pick]').forEach(x=>x.classList.remove('used'));b.classList.add('used');L.answer=+b.dataset.pick;const g=document.getElementById('gap');g.textContent=L.view.opts[L.answer].t;g.classList.add('filled');check.disabled=false;}));
  }else if(q.t==='assoc'){
    const V=L.view;
    const upd=()=>{app.querySelectorAll('[data-l]').forEach(b=>{const k=+b.dataset.l;b.classList.toggle('sel',V.pickL===k);b.classList.toggle('gone',V.matched.has('L'+k));b.disabled=V.matched.has('L'+k);});app.querySelectorAll('[data-r]').forEach(b=>{const k=+b.dataset.r;b.classList.toggle('sel',V.pickR===k);b.classList.toggle('gone',V.matched.has('R'+k));b.disabled=V.matched.has('R'+k);});};
    const tryMatch=()=>{if(V.pickL===null||V.pickR===null)return;const lb=app.querySelector(`[data-l="${V.pickL}"]`),rb=app.querySelector(`[data-r="${V.pickR}"]`);
      if(V.left[V.pickL].i===V.right[V.pickR].i){V.matched.add('L'+V.pickL);V.matched.add('R'+V.pickR);lb.classList.add('right');rb.classList.add('right');buzz(15);}
      else{V.errors++;lb.classList.add('wrong','shake');rb.classList.add('wrong','shake');buzz([30,40,30]);setTimeout(()=>{lb.classList.remove('wrong','shake');rb.classList.remove('wrong','shake');},450);}
      V.pickL=null;V.pickR=null;setTimeout(upd,V.matched.size===V.left.length*2?0:120);
      if(V.matched.size===V.left.length*2){L.answer=V.errors;setTimeout(doCheck,250);}};
    app.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickL=V.pickL===+b.dataset.l?null:+b.dataset.l;upd();tryMatch();}));
    app.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.pickR=V.pickR===+b.dataset.r?null:+b.dataset.r;upd();tryMatch();}));
  }else if(q.t==='ordre'){
    const V=L.view;const slots=document.getElementById('slots'),bank=document.getElementById('bank');
    const draw=()=>{slots.innerHTML=q.items.map((_,k)=>{const it=V.slots[k];return `<button class="slot ${it?'full':''}" data-s="${k}"><span class="i">${k+1}</span><span>${it?esc(it.t):''}</span></button>`;}).join('');
      bank.innerHTML=V.items.map((it,k)=>`<button class="chipb ${V.slots.some(s=>s&&s.k===k)?'used':''}" data-b="${k}" ${V.slots.some(s=>s&&s.k===k)?'disabled':''}>${esc(it.t)}</button>`).join('');
      slots.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;const k=+b.dataset.s;if(V.slots[k]){V.slots.splice(k,1);draw();}}));
      bank.querySelectorAll('[data-b]').forEach(b=>b.addEventListener('click',()=>{if(L.checked)return;V.slots.push({t:V.items[+b.dataset.b].t,i:V.items[+b.dataset.b].i,k:+b.dataset.b});draw();}));
      check.disabled=V.slots.length!==q.items.length;L.answer=V.slots.map(s=>s.i);};
    draw();
  }
}
function doCheck(){
  const {q}=L.cur;let ok=false,shown='';
  if(q.t==='qcm'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='vf'){ok=(L.answer===1)===q.a;shown=q.a?'Vrai':'Faux';app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if((k===1)===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});}
  else if(q.t==='trou'){ok=L.view.opts[L.answer].i===q.a;shown=q.o[q.a];app.querySelectorAll('[data-pick]').forEach(b=>{const k=+b.dataset.pick;b.disabled=true;if(L.view.opts[k].i===q.a)b.classList.add('right');else if(k===L.answer)b.classList.add('wrong');});const g=document.getElementById('gap');if(g){g.textContent=q.o[q.a];g.style.color=ok?'var(--ok-ink)':'var(--bad-ink)';}}
  else if(q.t==='assoc'){ok=L.answer===0;shown=L.answer===1?'une erreur d\'association':L.answer+' erreurs d\'association';}
  else if(q.t==='ordre'){ok=L.answer.every((v,k)=>v===k);shown=q.items.join(' → ');app.querySelectorAll('[data-s]').forEach((b,k)=>{b.disabled=true;b.classList.add(L.answer[k]===k?'right':'wrong');});app.querySelectorAll('[data-b]').forEach(b=>b.disabled=true);}
  L.checked=true;L.seen.add(L.cur.i);
  if(ok){buzz(20);if(!L.cur.retry)L.firstTry++;}
  else{buzz([40,60,40]);if(!L.cur.retry){L.wrongOnce.add(L.cur.i);L.wrongList.push(q);L.queue.push({q,i:L.cur.i,retry:true});}}
  const fb=document.getElementById('fb');fb.classList.add(ok?'good':'badf');
  const title=ok?['Exact !','Bien joué !','Parfait !','Oui !'][Math.floor(Math.random()*4)]:'Pas tout à fait';
  const body=ok?(q.e?esc(q.e):''):`${q.t==='assoc'?'':'<span class="ans">Réponse : '+esc(shown)+'</span><br>'}${q.e?esc(q.e):''}`;
  fb.querySelector('.fb-in').innerHTML=`<div class="msg"><div class="ic" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?ICON.check:ICON.x}</div><div><b>${title}</b><span>${body}</span></div></div><button class="btn wide ${ok?'ok':'bad'}" id="check">Continuer</button>`;
  const btn=document.getElementById('check');btn.addEventListener('click',nextQ);btn.focus({preventScroll:true});
  document.querySelector('.lbar .pb i').style.width=Math.round((L.total-L.queue.length)/L.total*100)+'%';
  document.querySelector('.lbar .cnt').textContent=(L.total-L.queue.length)+'/'+L.total;
}
function quitPrompt(){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h3>Quitter la leçon ?</h3><p>La progression de cette leçon ne sera pas enregistrée.</p><button class="btn wide" id="stay">Continuer la leçon</button><button class="btn ghost wide" id="leave">Quitter</button></div>`;
  document.body.appendChild(m);m.querySelector('#stay').addEventListener('click',()=>m.remove());m.querySelector('#leave').addEventListener('click',()=>{m.remove();L=null;home();});
}
function finish(){
  const acc=Math.round(L.firstTry/L.total*100);const perfect=L.wrongOnce.size===0;
  const xp=L.firstTry*10+(perfect?20:0)+(L.isReview?5:0);
  S.xp+=xp;touchStreak();
  if(!L.isReview){const prev=S.lessons[L.l.id]||{done:false,best:0};S.lessons[L.l.id]={done:true,best:Math.max(prev.best||0,acc)};}
  save();
  const color=L.u?`var(${L.u.c})`:'var(--brand)';
  const title=perfect?'Sans faute !':acc>=75?'Leçon terminée !':'Terminé, on y retourne bientôt';
  const sub=perfect?'Tu as répondu juste du premier coup à toutes les questions.':`${L.firstTry} bonne${L.firstTry>1?'s':''} réponse${L.firstTry>1?'s':''} du premier coup sur ${L.total}. Les questions manquées te sont revenues en fin de leçon.`;
  let h=`<div class="screen"><div class="result" style="--c:${color}"><div class="medal" style="border-color:${perfect?'var(--gold)':color};background:${perfect?'var(--gold-soft)':'var(--surface-2)'};color:${perfect?'var(--gold)':color}">${perfect?ICON.star:ICON.trophy}</div><h1>${title}</h1><p>${sub}</p>
  <div class="tiles"><div class="tile" style="--c:var(--gold-dark)"><div class="l">XP gagnés</div><div class="v">+${xp}</div></div><div class="tile" style="--c:${color}"><div class="l">Précision</div><div class="v">${acc} %</div></div><div class="tile" style="--c:#E0632B"><div class="l">Série</div><div class="v">${S.streak} j</div></div></div>`;
  if(L.wrongList.length){h+=`<div class="review-list"><b>À revoir dans les fiches :</b><ul>${L.wrongList.slice(0,5).map(q=>`<li>${esc(q.q.replace('___','…'))}</li>`).join('')}</ul></div>`;}
  h+=`<div class="acts">${!perfect?`<button class="btn" id="again">Refaire la leçon</button>`:''}<button class="btn ${perfect?'':'ghost'}" id="back">Continuer</button><a class="btn ghost" href="${FICHES_URL}">Ouvrir les fiches</a></div></div></div>`;
  app.innerHTML=h;window.scrollTo(0,0);
  const again=document.getElementById('again');if(again)again.addEventListener('click',()=>{const u=L.u,l=L.l,r=L.isReview;const qs=r?shuffle(allLessons().flatMap(x=>x.l.q.map(q=>Object.assign({},q,{_u:x.u})))).slice(0,12):l.q;startLesson(u,l,qs,r);});
  document.getElementById('back').addEventListener('click',()=>{L=null;home();});
}
home();
</script>
